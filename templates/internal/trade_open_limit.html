<!-- templates/emails/trade_open.html -->
<!DOCTYPE html>
<html>
<body>
    <h2>Trade Opened</h2>
    <p>A new trade has been opened with the following details:</p>
    
    <ul>
        <li>User: {{user_email}}</li>
        <li>Symbol: {{symbol}}</li>
        <li>Quantity: {{quantity}}</li>
        <li>Price: {{price}}</li>
        <li>Total Amount: {{amount}}</li>
        <li>Account ID: {{account_id}}</li>
        <li>Order Type: {{order_type}}</li>
        <li>Action: {{action}}</li>
    </ul>
</body>
</html>
