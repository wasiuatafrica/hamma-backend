<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot Demo</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .message.sent {
            background-color: #d9f9a5;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 8px;
        }

        .message.received {
            background-color: #c4e3ff;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 8px;
        }

        #chatArea {
            max-height: 500px; /* Set a max height for the chat area */
            overflow-y: auto; /* Enable vertical scrolling */
        }

        #loading {
            display: none;
            {% comment %} text-align: left; {% endcomment %}
            animation: flash 2s infinite;
            {% comment %} background-color: #c4e3ff; {% endcomment %}
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 8px;
        }

        @keyframes flash {
            0%, 50%, 100% {
                opacity: 0;
            }
            25%, 75% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">Trading AI</div>
                <div class="card-body" id="chatArea">
                    <!-- Chat messages will be displayed here -->
                </div>
                <div class="card-body" >
                    <div class="message received" id="loading">. . . . . . </div>
                </div>
                <div class="card-footer">
                    <input type="text" id="messageInput" class="form-control" placeholder="Type your message...">
                    <button class="btn btn-primary mt-2" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // On page load, prompt for email
    const email = prompt("Please enter your registered email:");

    // Generate a random conversation_id using UUID
    const conversation_id = uuidv4();

    // WebSocket connection URL using window.location.host
    const protocol = window.location.hostname.includes("herokuapp") ? "wss" : "ws";

    // WebSocket connection URL
    const socketUrl = `${protocol}://${window.location.host}/ws/markets-ai/?email=${email}&conversation_id=${conversation_id}`;

    // Create WebSocket connection
    const socket = new WebSocket(socketUrl);

    // Handle messages received from the server
    socket.addEventListener('message', function (event) {
        const message = JSON.parse(event.data);
        hideLoading(); // Hide loading when a message is received
        displayMessage(message.message, 'received');
    });

    // Function to send a message
    function sendMessage() {
        const messageInput = document.getElementById('messageInput');
        const message = messageInput.value;

        if (message.trim() !== '') {
            showLoading(); // Show loading animation

            // Send the message to the server
            socket.send(JSON.stringify({ message }));

            // Display the sent message in the chat area
            displayMessage(message, 'sent');

            // Clear the message input field
            messageInput.value = '';
        }
    }

    // Function to show loading animation
    function showLoading() {
        document.getElementById('loading').style.display = 'block';
        // Start flashing animation
    }

    // Function to hide loading animation
    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
        // Stop flashing animation
    }

    // Function to display messages in the chat area
    function displayMessage(message, type) {
        const chatArea = document.getElementById('chatArea');
        const messageElement = document.createElement('div');
        messageElement.className = `message ${type}`;
        messageElement.innerText = message;
        chatArea.appendChild(messageElement);
        // Scroll to the bottom of the chat area
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // Function to generate UUID
    function uuidv4() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            var r = Math.random() * 16 | 0,
                v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    // Attach key press event listener to the message input
    document.getElementById('messageInput').addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    });
</script>

</body>
</html>
