<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">Conversations</div>
                <div class="card-body">
                    <ul class="list-group" id="conversationList">
                        {% for conversation in conversations %}
                            <li class="list-group-item">
                                <a href="#" onclick="loadConversation('{{ conversation.id }}')">
                                    {{ conversation.name }}
                                </a>
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">Chat</div>
                <div class="card-body" id="chatArea">
                    <!-- Chat messages will be displayed here -->
                </div>
                <div class="card-footer">
                    <input type="text" id="messageInput" class="form-control" placeholder="Type your message...">
                    <button class="btn btn-primary mt-2" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // On page load, prompt for email
    const email = prompt("Please enter your email:");

    // Generate a random conversation_id using UUID
    let conversation_id = uuidv4();

    // WebSocket connection URL
    let socketUrl = `ws://127.0.0.1:8000/ws/markets-ai/?email=${email}&conversation_id=${conversation_id}`;

    // Create WebSocket connection
    let socket = new WebSocket(socketUrl);

    // Handle messages received from the server
    socket.addEventListener('message', function (event) {
        const message = JSON.parse(event.data);
        displayMessage(message.message, 'received');
    });

    // Function to send a message
    function sendMessage() {
        const messageInput = document.getElementById('messageInput');
        const message = messageInput.value;

        // Send the message to the server
        socket.send(JSON.stringify({ message }));

        // Display the sent message in the chat area
        displayMessage(message, 'sent');

        // Clear the message input field
        messageInput.value = '';
    }

    // Function to display messages in the chat area
    function displayMessage(message, type) {
        const chatArea = document.getElementById('chatArea');
        const messageElement = document.createElement('div');
        messageElement.className = `message ${type}`;
        messageElement.innerText = message;
        chatArea.appendChild(messageElement);
    }

    // Function to generate UUID
    function uuidv4() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            var r = Math.random() * 16 | 0,
                v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    function loadConversation(conversationId) {
        // Close the existing WebSocket connection, if any
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.close();
        }

        // Update the conversation_id for the selected conversation
        conversation_id = conversationId;

        // Update the chat area with the selected conversation name
        const selectedConversation = conversations.find(conv => conv.id == conversationId);
        const chatArea = document.getElementById('chatArea');
        chatArea.innerHTML = `<p>Conversation: ${selectedConversation.name}</p>`;

        // WebSocket connection URL for the selected conversation
        socketUrl = `ws://127.0.0.1:8000/ws/markets-ai/?email=${email}&conversation_id=${conversationId}`;

        // Create a new WebSocket connection
        socket = new WebSocket(socketUrl);

        // Handle messages received from the server
        socket.addEventListener('message', function (event) {
            const message = JSON.parse(event.data);
            displayMessage(message.message, 'received');
        });
    }
</script>

</body>
</html>
