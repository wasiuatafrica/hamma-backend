{% extends 'leaderboard/base.html' %}

{% block content %}
<div class="container">
    <h1>Delete Clan</h1>
    <p>Are you sure you want to delete the "{{ clan.clan_name }}" clan?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete Clan</button>
        <a href="{% url 'clan-detail' clan.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
