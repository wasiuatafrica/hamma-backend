  <style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
    

}
.navbar-collapse{
    flex-grow: unset;
}
ul{
    list-style: none;
    padding: 0;
}
a{
    text-decoration: none;
    /* color:#ffff; */
}

/* Navbar section */
.navbar-light .navbar-toggler {
    color: #ffffff;
    border-color: #359602;
}
.navbar-toggler{
    border: 1px solid #359602;
}
.nav-section{
    padding-left: 60px;
    padding-right: 60px;
    
}
.logo img{
width: 50%;
}
.link-holder{
    display: flex !important;
    justify-content: space-between;
    gap: 10px;
    width: 100% !important;
    font-family: 'PT Sans', sans-serif;
    font-style: normal;
    font-weight: 400;
    font-size: 16px;
    line-height: 155%;
}

    
.login{
    padding: 10px;
}

.login a{
    color:#000000
}
.create-acc{
    background: #359602;
    border-radius: 5px;
    padding: 10px;
    text-align: left;
}
.create-acc a{
    color:  #ffffff;
    padding-left: 4px;
    
}
/* Video merger section */
.video-meger-section{
    background: #359602 no-repeat url("https://shareft9ja.netlify.app/static/images/patternpad.png");
    padding: 20px;
    text-align: center;
    color: white;
}
.video-meger-text{
    font-weight: bold;
    line-height:30.36px;
    font-size: x-large;
}
/* Uploading section and information */
.upload-info{
    line-height: 30.36px;
}

.sub-upload-info1{
    display: inline;
}
.sub-upload-info2{
    display: block;
    width: 52%;
    margin-left: auto;
    margin-right: auto;

}
.uploading-section{
    /* margin-left: auto;
    margin-right: auto; */
    margin-top: 10px;
    /* width: 40%; */
    text-align: center !important;
}
#description-info{
    display:none;
}
.video-description{
    padding: 6px;
    width: 288px;
    border: 0.7px solid #c1b1b1;
    border-radius: 10px;
}
.upload-box-holder{
    display: flex;
    justify-content: center;
    align-items: center;
}
.upload-box{
    margin-top: 10px;
    padding: 6px;
    width: 300px;
    border: 0.7px solid #c1b1b1;
    border-radius: 10px;
    height: 200px;
    padding-top: 40px;
    text-align: center;
}
.bi-cloud-arrow-up{
    color: #359602;
    font-size: 40px;
}
.merger-btn-holder{
    margin-top: 20px;
}
.merger-btn-holder button{
    background-color: #359602;
    color: #ffffff;
    padding: 5px;
    width: 288px;
    border-radius: 10px;

}

/* video-ouput-hoder */
.video-ouput-hoder{
    background: #F4F4F4;
    border-radius: 20px;
    text-align: center;
    margin-top: 40px;
    margin-left: 100px;
    margin-right: 100px;
}
#video-stream{
    display: none;
}
.rectangle-bg {
    text-align: center;
}
.rectangle-bg img{
    margin-top: 20px;
    padding: 0 10px;
}

.download-share-btns{
    display: flex;
    flex-wrap: wrap;
    text-align: center;
    justify-content: center;
    gap: 30px;
    margin-top: 20px;
    margin-bottom: 20px;
}
.download-share-btns button{
    border: 0;
    padding: 7px;
    border-radius: 10px;
    
}
.download-holder button{
    background-color: #359602;
    color: #ffffff;
    width: 132px;
    display: block;

}
.share-holder button{
    border: 1px solid #c1b1b1;
    width: 132px;

}
/* Footer section */
.footer{
    background-color: #359602;
    color: white;
    padding: 20px 60px 20px 60px;
    margin-top: 30px;
    font-size:13px;
    list-style: none;
    /* text-align: justify; */
    
}
.footer .title{
    margin-bottom: 10px;
}
.footer li{
    padding-bottom: 5px;
}
.footer-logo {
    margin-bottom: 10px;
}
.footer .about-us .logo img{
    width: 50px;
}
.footer a{
    color: #ffffff;
    
}
.footer-help{
    padding-left: 10px;
}
.about-text{
    margin-right: 10px;
}

/* streaming video */
#video-container {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-top: 20px;
}

#video-container video {
    max-width: 100%;
    max-height: 100%;
}
.social-share{
    display: flex;
    gap: 20px;
    font-size: 30px;
    justify-content: center;
    align-items: center;
}
.download-share-btns{
    display:none;
}
/* Affilate program styling */
.form{
    margin: 0 20%;
    padding: 10px;
    
}
.affilate-link{ 
    display: flex;
    gap: 3px;
    overflow-x: hidden;
    border: 1px solid #359602;
    padding: 10px 10px;
    position: relative;
    left: 999999px;
}
.affilate-link-copy{
    margin-right: 6px;
}
.loading-button, #passwordHelp{
    display: none;
}

#normal_receipts, #payStack_receipts{
    display: none;
}
</style>
