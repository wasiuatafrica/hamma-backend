{% extends 'leaderboard/base.html' %}
{% block content %}
<div class="main-body">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Join Competition</h2>
                    </div>
                    <div class="card-body">
                        {% if error_message %}
                        <div class="alert alert-danger" role="alert">
                            {{ error_message }}
                        </div>
                        {% endif %}
                        {% if success_message %}
                        <div class="alert alert-success" role="alert">
                            {{ success_message }}
                        </div>
                        {% endif %}
                        <form method="post">
                            {% csrf_token %}
                            <!-- Added hidden input field for action -->
                            <input type="hidden" name="action" value="join">
                            
                            <!-- Change button type to submit -->
                            <button type="submit" class="btn btn-success">Join</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
