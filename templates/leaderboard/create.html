{%extends 'leaderboard/base.html'%}
{%block content%}
    <!-- Here is the main page body starts here -->
    <div class="main-body">
        {% comment %} <div class="bg-white "> {% endcomment %}
            <div class="left-bold-title">
                <div class="container">
                    <h2>Create a Competition</h2>
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group ">
                            <label for="start_date" class="form-label">Start Date:</label>
                            <input type="datetime-local" class="form-control" id="start_date" name="start_date" required>
                        </div>
            
                        <div class="form-group">
                            <label for="end_date" class="form-label">End Date:</label>
                            <input type="datetime-local" class="form-control" id="end_date" name="end_date" required>
                        </div>
            
                        <div class="form-group">
                            <label for="title" class="form-label">Title:</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
            
                        <div class="form-group">
                            <label for="first_prize" class="form-label">Prize:</label>
                            <input type="text" class="form-control" id="first_prize" name="first_prize" required>
                        </div>
            
                        {% comment %} <div class="form-group">
                            <label for="second_prize" class="form-label">Second Prize:</label>
                            <input type="text" class="form-control" id="second_prize" name="second_prize" required>
                        </div>
            
                        <div class="form-group">
                            <label for="third_prize" class="form-label">Third Prize:</label>
                            <input type="text" class="form-control" id="third_prize" name="third_prize" required>
                        </div> {% endcomment %}
                        <div class="form-group">
                            <label for="notification" class="form-label">Notification Message:</label>
                            <textarea type="text" class="form-control" id="notification" name="notification" placeholder="Notification message to be seen on main ft9ja as written." required></textarea>
                        </div>
            
                        {% comment %} <div class="form-group">
                            <label for="status" class="form-label">Status:</label>
                            <select class="form-control" id="status" name="status">
                                <option value="current">Current</option>
                                <option value="closed">Closed</option>
                            </select>
                        </div> {% endcomment %}
                        <br>
                        <button type="submit" class="btn btn-success">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {%endblock%}
