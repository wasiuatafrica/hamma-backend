<!-- Your HTML template -->
<!DOCTYPE html>
<html>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dygraphs@2.1.0/dist/dygraph.min.css" />
<head>
  <!-- Your other header content -->
</head>
<body>
  <!-- Your other body content -->

  <!-- Add the canvas element for the chart -->
  {% comment %} <canvas id="dygraphLine1" width="800" height="400"></canvas> {% endcomment %}
  <div id="dygraphLine1" style="width: 100%; height: 300px;"></div>

  <!-- Include the Dygraph library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dygraph/2.1.0/dygraph.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      'use strict';
    
      // Assume that the django view passes the lists as JSON objects
      const timestamps = JSON.parse('{{ timestamps|safe }}'); // List of unix timestamps
      const balances = JSON.parse('{{ balances|safe }}'); // List of balance values
      const equity = JSON.parse('{{ equity|safe }}'); // List of equity values
    
      // Convert the unix timestamps to Date objects
      const dates = timestamps.map(ts => new Date(ts * 1000));
    
      // Log the first 5 data points in each list
      console.log('First 5 Dates:', dates.slice(0, 5));
      console.log('First 5 Balances:', balances.slice(0, 5));
      console.log('First 5 Equity:', equity.slice(0, 5));
    
      const ctx8 = document.getElementById('dygraphLine1');
      const data = [];
      for (let i = 0; i < dates.length; i++) {
        data.push([dates[i], balances[i], equity[i]]);
      }
    
      const dygraph = new Dygraph(ctx8, data, {
        labels: ['Date', 'Balance', 'Equity'],
        colors: ['#00ff00', '#f10075'],
        labelsSeparateLines: false,
        ylabel: 'Balance & Equity',
        xlabel: 'Time (GMT)',
        legend: 'always',
      });
    });
      </script>
</body>
</html>
