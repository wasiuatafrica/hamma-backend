{% extends 'api/base.html' %}
{% block text %} FAQ Reactions {% endblock %}
{% block content %}

    <div class="table-responsive" >
        
        <table class="table table-striped mt-4 table-bordered table-hover">
            <thead>
                <tr>
                    <th>Question</th>
                    <th>Maybe</th>
                    <th>Yes</th>
                    <th>No</th>
                </tr>
            </thead>
            <tbody>
                {% for reaction in faq %}
                <tr>
                    <td>{{ reaction.question }}</td>
                    <td>{{ reaction.maybe_count }}</td>
                    <td>{{ reaction.yes_count }}</td>
                    <td>{{ reaction.no_count }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    
    </div>

    
{% endblock %}
