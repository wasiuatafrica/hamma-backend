{% extends 'api/base.html' %}
{% load static crispy_forms_tags %}
<!-- your_template.html -->
{%block text%} Create Trader Account{%endblock%}
{% block content %}
    <div class="form-holder mt-5">
        <form id="form">
            {%csrf_token%}
            {% comment %} <div class="mb-3">
                <label for="exampleInputFullName" class="form-label">User</label>
                <select class="form-select" name="trader" required id="user">
                    <option value="" selected disabled>Select user</option>
                    {%for user in users%}
                    <option value={{user}}>{{user}}</option>
                    {%endfor%}
                    <!-- Add more options as needed -->
                </select>
            </div> {% endcomment %}
            <div class="mb-3">
                <label for="exampleInputFullName" class="form-label">User</label>
                <input type="text" class="form-control" id="user" name="trader" required placeholder="Search for user">
                <!-- Display user suggestions here -->
                <div id="user-suggestions"></div>
            </div>
            <div class="mb-3">
                <label for="exampleInputFullName" class="form-label">Account</label>
                <input type="number" class="form-control" id="number" name="number" step="1" required >

            </div>
            
            <div class="mb-3">
                <label for="exampleInputFullName" class="form-label">Server</label>
                {% comment %} <select class="form-select" name="platform" required id="server">
                    <!-- <option value="" selected disabled>Select Server</option> -->
                    <option value="Deriv-Demo">Deriv-Demo</option>
                    <option value="ICMarketsSC-Demo">ICMarketsSC-Demo</option>
                    <option value="MetaQuotes-Demo">MetaQuotes-Demo</option>
                    <!-- Add more options as needed -->
                </select> {% endcomment %}
                <input type="text"  class="form-control" name="platform" required id="broker">
            </div>
            <div class="mb-3">
                <label for="exampleInputFullName" class="form-label">Account Type</label>
                <select class="form-select" name="typeofaccount" id="typeofaccount" required>
                    <!-- <option value="" selected disabled>Select Server</option> -->
                    <option value="Zuma">Zuma</option>
                    {% comment %} <option value="Aso">Aso</option> {% endcomment %}
                    <option value="Challenge">Challenge</option>
                    {% comment %} <option value="Verification">Verification</option> {% endcomment %}
                    <!-- Add more options as needed -->
                </select>
            </div>
            
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Password</label>
                <input type="text" name="password" class="form-control" id="exampleInputPassword1" required>
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Investor Password</label>
                <input type="text" name="investor_password" class="form-control" id="investor_password" required>
            </div>
            <div class="mb-3">
                <label for="broker" class="form-label">Platform</label>
                <select class="form-select" name ="broker" id="platform" required >
                    <option value="MT4">MT4</option>
                    <option value="MT5">MT5</option>
                    <!-- Add more options as needed -->
                </select>
            </div>
            <div class="mb-3">
                <label for="payout" class="form-label">Payout</label>
                <select class="form-select" name ="payout" id="payout" required >
                    <option value="Weekly">Weekly</option>

                    <option value="Bi-Weekly">Bi-Weekly</option>

                    <option value="Monthly">Monthly</option>
                    <!-- Add more options as needed -->
                </select>
            </div>
            <div class="mb-3">
                <label for="accountSize" class="form-label">Account Size</label>
                <input type="text" name="acc_size" class="form-control" id="acc_size" required>
            </div>
            <div class="err">

            </div>
            <div class="merger-btn-holder text-center form-button"><button type="submit">Create Account</button></div>
            <div class="merger-btn-holder text-center loading-button"><button type="button" disabled>
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> creating account</button></div>
        </form>

<input type="hidden" id="redirect-url" value="{% url 'user_accounts_list' %}">

    </div>
    <script>
        $(document).ready(function () {
            $("#user").on("input", function () {
                var searchTerm = $(this).val();
                $.ajax({
                    url: "/api/search-users/",
                    data: { q: searchTerm },
                    dataType: "json",
                    success: function (data) {
                        var suggestionsHtml = "";
                        data.users.forEach(function (user) {
                            suggestionsHtml += `<div class="user-suggestion">${user.username}</div>`;
                        });
                        $("#user-suggestions").html(suggestionsHtml);
                    },
                });
            });

            


            $("#typeofaccount").change(()=>{
                $(".err").html("")
            })
            $("#number").keydown((e)=>{
                var invalidChars = [
                "-",
                "+",
                "e",
                ];
                if (invalidChars.includes(e.key)) {
                e.preventDefault();
            }
            })
            // var inputBox = document.getElementById("number");

            // var invalidChars = [
            // "-",
            // "+",
            // "e",
            // ];
            

            // inputBox.addEventListener("keydown", function(e) {
            // cc
            // });
            $("#form").submit((e)=>{
                e.preventDefault();
                $(".form-button").css("display", "none")
                $(".loading-button").css("display", "block")
                const csrfToken = $('input[name="csrfmiddlewaretoken"]').val();
                $.ajax({
                    type: "POST",
                    url: "",
                    data: {
                        "csrfmiddlewaretoken": csrfToken, // Change "X-CSRFToken" to "csrfmiddlewaretoken"
                        "trader": $("#user").val(),
                        "number": $("#number").val(),
                        "password": $("#exampleInputPassword1").val(),
                        "investor_password": $("#investor_password").val(),
                        "platform": $("#platform").val(),
                        "typeofaccount": $("#typeofaccount").val(),
                        "broker": $("#broker").val(),
                        "acc_size": $("#acc_size").val(),
                        "payout":$("#payout").val(),
                        // "scdChance":$("#scdChance").val()
                    },
                    success: function(resp){
                        $(".err").html(`
                        <div class="alert alert-success" role="alert">
                            ${resp.details}
                        </div> 
                        `)
                        document.querySelector("#form").reset()
                        $(".form-button").css("display", "block")
                        $(".loading-button").css("display", "none")
                       var redirectUrl = document.getElementById("redirect-url").value;
                        
                        window.location.href = redirectUrl;
            
                    },
                    error: function(err){
                        console.log(err)
                        $(".err").html(`
                        <div class="alert alert-danger" role="alert">
                            ${err.responseJSON.details}
                        </div> 
                        `)
                        $(".form-button").css("display", "block")
                        $(".loading-button").css("display", "none")
                    }
                });
            });
        });
    </script>
    
{% endblock content %}
