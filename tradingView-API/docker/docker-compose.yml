
services:
  unified_price_system:
    build: .
    command: python unified_price_system3.py
    env_file: .env  # MONGO_URL=...; see .env.example
    volumes:
      - .:/app
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8080:8080