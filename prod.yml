version: '3.8'

services:
  web:
    build:
      context: ./project
      dockerfile: Dockerfile.prod
    command: daphne -b 0.0.0.0 -p 8000 backend.asgi:application
    volumes:
      - static_volume:/home/app/web/staticfiles
      - media_volume:/home/app/web/mediafiles
    # expose:
    #   - 8000
    ports:
      - 8000:8000
    env_file:
      - ./envs/.env.prod
    depends_on:
      - db
      
  celery:
    build:
      context: ./project
      dockerfile: Dockerfile.prod
    command: celery --app=backend worker --loglevel=info 
    
    volumes:
      - ./project/:/usr/src/app/
    env_file:
      - ./envs/.env.prod
    depends_on:
      - web
      - redis
 
  redis:
    image: redis:7-alpine
  
  db:
    image: postgres:15.0-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=anyon
      - POSTGRES_PASSWORD=anyon2
      - POSTGRES_DB=anyon

  # nginx-proxy:
