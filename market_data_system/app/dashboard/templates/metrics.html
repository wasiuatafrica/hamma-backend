<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Metrics - Market Data System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            padding-top: 20px;
            padding-bottom: 20px;
        }
        .chart-container {
            height: 300px;
            margin-bottom: 30px;
        }
        .card {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <h1>System Metrics Dashboard</h1>
                <div>
                    <a href="/" class="btn btn-outline-secondary me-2">Back to Dashboard</a>
                    <button id="refreshBtn" class="btn btn-primary">Refresh</button>
                    <span id="lastRefresh" class="text-muted ms-2">Last refresh: Never</span>
                </div>
            </div>
        </header>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Task Execution Time (seconds)</div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="taskExecutionChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Data Points Processed</div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="dataPointsChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">Performance Metrics History</div>
                    <div class="card-body p-0">
                        <table class="table table-striped table-bordered mb-0">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Component</th>
                                    <th>Operation</th>
                                    <th>Duration (sec)</th>
                                    <th>Data Points</th>
                                </tr>
                            </thead>
                            <tbody id="metricsTable">
                                <tr>
                                    <td colspan="5" class="text-center">Loading metrics data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let taskExecutionChart = null;
        let dataPointsChart = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            refreshData();
            
            document.getElementById('refreshBtn').addEventListener('click', refreshData);
            
            // Auto refresh every 5 minutes
            setInterval(refreshData, 300000);
        });
        
        function refreshData() {
            fetch('/api/logs/recent')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch logs');
                    }
                    return response.json();
                })
                .then(data => {
                    updateMetricsTable(data.performance);
                    updateCharts(data.performance);
                    updateLastRefreshTime();
                })
                .catch(error => {
                    console.error('Error loading metrics:', error);
                    alert('Failed to load metrics. Check console for details.');
                });
        }
        
        function updateLastRefreshTime() {
            const now = new Date();
            document.getElementById('lastRefresh').textContent = `Last refresh: ${now.toLocaleTimeString()}`;
        }
        
        function updateMetricsTable(metrics) {
            const tableBody = document.getElementById('metricsTable');
            tableBody.innerHTML = '';
            
            if (metrics && metrics.length > 0) {
                metrics.forEach(metric => {
                    const row = document.createElement('tr');
                    
                    const timestamp = new Date(metric.timestamp);
                    row.appendChild(createCell(timestamp.toLocaleString()));
                    
                    row.appendChild(createCell(metric.component));
                    row.appendChild(createCell(metric.operation));
                    row.appendChild(createCell(metric.duration_seconds.toFixed(2)));
                    row.appendChild(createCell(metric.data_points || 'N/A'));
                    
                    tableBody.appendChild(row);
                });
            } else {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 5;
                cell.className = 'text-center';
                cell.textContent = 'No metrics data available';
                row.appendChild(cell);
                tableBody.appendChild(row);
            }
        }
        
        function updateCharts(metrics) {
            if (!metrics || metrics.length === 0) {
                return;
            }
            
            // Group metrics by component and operation
            const groupedMetrics = {};
            metrics.forEach(metric => {
                const key = `${metric.component} - ${metric.operation}`;
                if (!groupedMetrics[key]) {
                    groupedMetrics[key] = [];
                }
                groupedMetrics[key].push({
                    timestamp: new Date(metric.timestamp),
                    duration: metric.duration_seconds,
                    dataPoints: metric.data_points || 0
                });
            });
            
            // Sort metrics by timestamp
            Object.keys(groupedMetrics).forEach(key => {
                groupedMetrics[key].sort((a, b) => a.timestamp - b.timestamp);
            });
            
            // Prepare data for charts
            const labels = Object.keys(groupedMetrics);
            const executionTimeData = labels.map(key => {
                const latestMetric = groupedMetrics[key][groupedMetrics[key].length - 1];
                return latestMetric.duration;
            });
            
            const dataPointsData = labels.map(key => {
                const latestMetric = groupedMetrics[key][groupedMetrics[key].length - 1];
                return latestMetric.dataPoints;
            });
            
            // Create or update charts
            updateExecutionTimeChart(labels, executionTimeData);
            updateDataPointsChart(labels, dataPointsData);
        }
        
        function updateExecutionTimeChart(labels, data) {
            const ctx = document.getElementById('taskExecutionChart').getContext('2d');
            
            if (taskExecutionChart) {
                taskExecutionChart.data.labels = labels;
                taskExecutionChart.data.datasets[0].data = data;
                taskExecutionChart.update();
            } else {
                taskExecutionChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Execution Time (seconds)',
                            data: data,
                            backgroundColor: 'rgba(54, 162, 235, 0.6)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Seconds'
                                }
                            }
                        }
                    }
                });
            }
        }
        
        function updateDataPointsChart(labels, data) {
            const ctx = document.getElementById('dataPointsChart').getContext('2d');
            
            if (dataPointsChart) {
                dataPointsChart.data.labels = labels;
                dataPointsChart.data.datasets[0].data = data;
                dataPointsChart.update();
            } else {
                dataPointsChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Data Points Processed',
                            data: data,
                            backgroundColor: 'rgba(75, 192, 192, 0.6)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Count'
                                }
                            }
                        }
                    }
                });
            }
        }
        
        function createCell(text) {
            const cell = document.createElement('td');
            cell.textContent = text;
            return cell;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
