<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Details - Market Data System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 20px;
            padding-bottom: 20px;
        }
        .card {
            margin-bottom: 20px;
        }
        pre {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <h1>Error Details</h1>
                <div>
                    <a href="/" class="btn btn-outline-secondary">Back to Dashboard</a>
                </div>
            </div>
        </header>

        <div class="card" id="errorDetails">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <span id="errorComponent">Loading...</span>
                    <span id="errorTimestamp" class="text-muted">Loading...</span>
                </div>
            </div>
            <div class="card-body">
                <h5 class="card-title">Error Message</h5>
                <p id="errorMessage" class="card-text">Loading...</p>
                
                <h5 class="card-title mt-4">Stack Trace</h5>
                <pre id="stackTrace">Loading...</pre>
                
                <div id="dataSection" class="mt-4">
                    <h5 class="card-title">Associated Data</h5>
                    <pre id="errorData">Loading...</pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const errorId = urlParams.get('id');
            
            if (!errorId) {
                showError('No error ID provided');
                return;
            }
            
            loadErrorDetails(errorId);
        });
        
        function loadErrorDetails(errorId) {
            fetch(`/api/errors/${errorId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch error details');
                    }
                    return response.json();
                })
                .then(data => {
                    updateErrorDetailsPage(data);
                })
                .catch(error => {
                    console.error('Error loading error details:', error);
                    showError('Failed to load error details');
                });
        }
        
        function updateErrorDetailsPage(data) {
            document.getElementById('errorComponent').textContent = data.component;
            
            const timestamp = new Date(data.timestamp);
            document.getElementById('errorTimestamp').textContent = timestamp.toLocaleString();
            
            document.getElementById('errorMessage').textContent = data.error_message;
            
            if (data.stack_trace) {
                document.getElementById('stackTrace').textContent = data.stack_trace;
            } else {
                document.getElementById('stackTrace').textContent = 'No stack trace available';
            }
            
            if (data.data) {
                document.getElementById('errorData').textContent = JSON.stringify(data.data, null, 2);
            } else {
                document.getElementById('dataSection').style.display = 'none';
            }
        }
        
        function showError(message) {
            document.getElementById('errorComponent').textContent = 'Error';
            document.getElementById('errorTimestamp').textContent = '';
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('stackTrace').textContent = 'No stack trace available';
            document.getElementById('dataSection').style.display = 'none';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
