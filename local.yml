version: '3.8'

services:
  web:
    build: ./project
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./project/:/usr/src/app/
    ports:
      - 8000:8000
    env_file:
      - ./envs/.env.dev
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

  # celery:
  #   build: ./project
  #   command: celery -A backend worker -l info
  #   volumes:
  #     - ./project/:/usr/src/app/
  #   depends_on:
  #     - redis

  # celery-beat:
