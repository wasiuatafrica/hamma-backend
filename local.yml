version: '3.8'

services:
  web:
    build: ./project
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./project/:/usr/src/app/
    ports:
      - 8000:8000
    env_file:
      - ./envs/.env.dev
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

  celery:
    build:
      context: ./project
      dockerfile: Dockerfile
    command: celery --app=backend worker --loglevel=info 
    
    volumes:
      - ./project/:/usr/src/app/
    env_file:
      - ./envs/.env.dev
    depends_on:
      - web
      - redis

  celery-beat:
    build:
      context: ./project
      dockerfile: Dockerfile
    command: celery --app=backend beat --loglevel=info 
    
    volumes:
      - ./project/:/usr/src/app/
    env_file:
      - ./envs/.env.dev
    depends_on:
      - celery
  
  dozzle:
    image: amir20/dozzle:v5.7.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
    - 8080:8080
    # environment:
    #   DOZZLE_USERNAME: platinex
    #   DOZZLE_PASSWORD: parsta      
    depends_on:
      - web