  #   command: celery -A backend beat -l info
  #   volumes:
  #     - ./project/:/usr/src/app/
  #   depends_on:
  #     - redis
  
  dozzle:
    image: amir20/dozzle:v5.7.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
    - 8080:8080
    # environment:
    #   DOZZLE_USERNAME: platinex
    #   DOZZLE_PASSWORD: parsta      
    depends_on:
      - web